[project]
name = "tech-lead-agent"
version = "0.1.0"
description = "Agent Lead Développeur / Tech Lead : revues de code rigoureuses, découpage en tâches atomiques et arbitrages techniques (ADR), avec le SDK Mistral Agents."
requires-python = ">=3.12,<3.15"
dependencies = [
    # SDK Mistral Agents : extra "koyeb" = sandbox Mistral, "bashkit" = sandbox shell léger.
    "mistralai-agents[bashkit,koyeb]==1.1.0",
    # Requis par agents.LocalDockerSandbox (sandbox locale en développement).
    "docker>=7.0.0",
]

# Le CLI `agents` (chat, deploy, logs...) charge l'agent depuis cet entrypoint.
[tool.mistralai.agents]
entrypoint = "main:agent"
